# Public/server configuration only. Never put passwords or DATABASE_URL in this file.
# Copy to deploy/cloudrun.env.yaml and fill the actual domain and SMTP sender.
# PORT is supplied by Cloud Run; do not override it here.
DJANGO_DEBUG: 'false'
ENABLE_DEV_LOGIN: 'false'
DJANGO_ALLOWED_HOSTS: ''
PUBLIC_API_ORIGIN: ''
CSRF_TRUSTED_ORIGINS: ''
DJANGO_TRUST_PROXY_SSL_HEADER: 'true'
DJANGO_SECURE_SSL_REDIRECT: 'true'
DJANGO_SECURE_HSTS_SECONDS: '3600'
DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: 'false'
DJANGO_SECURE_HSTS_PRELOAD: 'false'
WECHAT_APPID: 'wxb78bc0898b0d8c1c'
WECHAT_CONTENT_SAFETY_MODE: 'wechat'
DB_POOL_MODE: 'session'
DB_CONN_MAX_AGE: '0'
EMAIL_HOST: ''
EMAIL_PORT: '587'
EMAIL_USE_TLS: 'true'
EMAIL_USE_SSL: 'false'
DEFAULT_FROM_EMAIL: ''
MEMBERSHIP_ALLOWED_EMAIL_DOMAINS: 'student.monash.edu'
WEB_CONCURRENCY: '1'
GUNICORN_THREADS: '4'
GUNICORN_TIMEOUT: '30'
