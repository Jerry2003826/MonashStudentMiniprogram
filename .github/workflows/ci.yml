name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  miniprogram:
    name: 小程序检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: 类型检查
        run: npm run typecheck
      - name: 代码检查
        run: npm run lint
      - name: 格式检查
        run: npm run format:check
      - name: 单元测试
        run: npm test
