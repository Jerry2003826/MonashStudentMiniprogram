name: CI

on:
  push:
    branches: [main, 'Jiarui/**']
  pull_request:

jobs:
  miniprogram:
    name: 小程序检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 准备小程序组件
        run: npm run prepare:components
      - name: 类型检查
        run: npm run typecheck
      - name: 代码检查
        run: npm run lint
      - name: 格式检查
        run: npm run format:check
      - name: 单元测试
        run: npm test

  backend:
    name: 后端检查（SQLite）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - name: 配置 Python 与 uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.9.27'
          python-version: '3.12'
          working-directory: server
          enable-cache: true
      - run: uv sync --locked
      - name: 代码与格式检查
        run: uv run ruff check . && uv run ruff format --check .
      - name: Django 系统与迁移检查
        env:
          DJANGO_SETTINGS_MODULE: config.settings_test
        run: uv run python manage.py check && uv run python manage.py makemigrations --check --dry-run
      - name: 权限与业务测试
        run: uv run pytest

  backend-postgres:
    name: 后端检查（PostgreSQL 16）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mnp_ci
          POSTGRES_USER: mnp_ci
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mnp_ci -d mnp_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings_test
      # Dedicated disposable CI service only. Django creates/drops test_mnp_ci;
      # this role must never be reused for an application or production database.
      TEST_DATABASE_URL: postgresql://mnp_ci:disposable-ci-only@127.0.0.1:5432/mnp_ci?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - name: 配置 Python 与 uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.9.27'
          python-version: '3.12'
          working-directory: server
          enable-cache: true
      - run: uv sync --locked
      - name: PostgreSQL 系统与迁移检查
        run: |
          uv run python manage.py check --database default
          uv run python manage.py makemigrations --check --dry-run
      - name: PostgreSQL 完整测试（包含迁移建库）
        run: uv run pytest --create-db

  production-container:
    name: 生产容器冒烟测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - name: 配置 Python 与 uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.9.27'
          python-version: '3.12'
          working-directory: server
          enable-cache: true
      - run: uv sync --locked
      - name: 独立 PostgreSQL 16 与 DEBUG=false 容器验证
        run: uv run python -m ops.container_smoke --report var/container-smoke-report.json
